<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OG Image – Thi Nguyen Leon | Sticker Factory</title>
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@600;700;800&family=Montserrat:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Montserrat', sans-serif;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .og-card {
      width: 1200px;
      height: 630px;
      background: #ffffff;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Left panel – red */
    .left-panel {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 380px;
      background: #E31E24;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 40px 36px;
    }

    .left-panel::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-radial-gradient(
        circle at 0% 100%,
        transparent 0px,
        transparent 3px,
        rgba(255,255,255,0.15) 3px,
        rgba(255,255,255,0.15) 4px
      );
    }

    .name {
      font-family: 'Epilogue', sans-serif;
      font-size: 120px;
      font-weight: 800;
      color: #ffffff;
      line-height: 0.9;
      letter-spacing: -2px;
      position: relative;
      z-index: 1;
    }

    .name-accent {
      color: #1a1a2e;
    }

    .divider {
      width: 80px;
      height: 3px;
      background: #ffffff;
      margin: 24px 0 16px;
      position: relative;
      z-index: 1;
    }

    .company {
      font-family: 'Montserrat', sans-serif;
      font-size: 26px;
      font-weight: 600;
      color: rgba(255,255,255,0.9);
      letter-spacing: 1px;
      text-transform: uppercase;
      position: relative;
      z-index: 1;
    }

    /* Right area */
    .right-area {
      position: absolute;
      left: 380px;
      right: 0;
      top: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Curved red frame on right */
    .right-area::before {
      content: '';
      position: absolute;
      right: -100px;
      top: -100px;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: #E31E24;
      opacity: 0.08;
    }

    .right-area::after {
      content: '';
      position: absolute;
      right: -60px;
      top: -60px;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: #E31E24;
      opacity: 0.15;
    }

    /* Photo placeholder */
    .photo-area {
      width: 420px;
      height: 480px;
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      z-index: 1;
      background: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-area img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f5f5f5 0%, #e0e0e0 100%);
      color: #ccc;
      font-size: 14px;
    }

    /* Bottom bar */
    .bottom-bar {
      position: absolute;
      bottom: 0;
      left: 380px;
      right: 0;
      height: 100px;
      background: #1a1a2e;
      display: flex;
      align-items: center;
      padding: 0 48px;
      gap: 40px;
    }

    .info-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .info-label {
      font-size: 11px;
      color: rgba(255,255,255,0.45);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 600;
    }

    .info-value {
      font-size: 18px;
      color: #ffffff;
      font-weight: 600;
    }

    .url-badge {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #E31E24;
      padding: 10px 20px;
      border-radius: 100px;
    }

    .url-badge span {
      font-size: 16px;
      color: #ffffff;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .url-badge .dot {
      width: 8px;
      height: 8px;
      background: #4ade80;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div class="og-card">
    <!-- Left Panel -->
    <div class="left-panel">
      <div class="name">Leon<span class="name-accent">.</span></div>
      <div class="divider"></div>
      <div class="company">Sticker Factory</div>
    </div>

    <!-- Right Photo Area -->
    <div class="right-area">
      <div class="photo-area">
        <!--
          Replace the img src below with Leon's actual photo.
          Recommended: crop to fill the rounded rectangle.
          The area is 420×480px.
        -->
        <img src="seo_avatar.png" alt="Thi Nguyen (Leon) – Sticker Factory" />
      </div>
    </div>

    <!-- Bottom Bar -->
    <div class="bottom-bar">
      <div class="info-item">
        <span class="info-label">Vai trò</span>
        <span class="info-value">Founder / Business Development</span>
      </div>
      <div class="info-item">
        <span class="info-label">Chuyên môn</span>
        <span class="info-value">Sticker, In ấn, Nhận diện thương hiệu</span>
      </div>
      <div class="url-badge">
        <div class="dot"></div>
        <span>leon.stickerfactory.vn</span>
      </div>
    </div>
  </div>
</body>
</html>
